# Fast demonstration configuration
# Bounded end-to-end validation run; measured ~9 minutes on the development
# machine, with substantial machine-load variation. It is not a toy test set:
# it uses the full rating/trust files and a 2-hop ego subgraph for diffusion.

data_dir: "Assignment"
results_dir: "results/fast_demo"

split_seed: 42
train_frac: 0.70
val_frac: 0.15

top_k: 10
relevance_threshold: 4

# Fixed, seeded sample of evaluation users for top-K ranking metrics in fast demo
ranking_sample_users: 500
ranking_sample_seed: 42

# Bounded deterministic sample of recommendation lists for diversity
diversity_sample_users: 500

item_based_cf:
  max_neighbors: 20
  min_corated: 2

matrix_factorization:
  n_factors: 10
  lr: 0.005
  reg: 0.02
  n_epochs: 6
  seed: 42

social:
  lambda_values: [0.0, 0.3, 0.5]
  k_similar: 10
  comparison_sample: 50

diffusion:
  subgraph:
    enabled: true
    method: "ego_network"
    center_user: 0
    hops: 2
  n_simulations: 3
  seed_size: 5
  seed: 42
  max_rounds: 25
  propagation_probs: [0.01, 0.05]
  recovery_probs: [0.0, 0.2]
  base_adopt_prob: 0.5
  default_affinity: 0.3
  target_lower_quantile: 0.40
  target_upper_quantile: 0.60

influence:
  budgets: [1, 3, 5]
  propagation_prob: 0.05
  n_simulations: 2
  candidate_pool_size: 15
  random_trials: 3
  seed: 42

group_recommendation:
  n_groups: 3
  group_size: 4
  conflicting: true
  top_n: 5
  diffusion_simulations: 2
  propagation_prob: 0.05
  base_adopt_prob: 0.5
  seed: 42

evaluation:
  run_diffusion_interaction: true
  interaction_simulations: 2
  interaction_seed_size: 5
  interaction_propagation_prob: 0.05
  interaction_base_adopt_prob: 0.5
  interaction_max_rounds: 25
  interaction_default_affinity: 0.3
  target_lower_quantile: 0.40
  target_upper_quantile: 0.60

intervention:
  thresholds: [0.0, 0.3, 0.6, 0.8, 0.9]
  base_adopt_prob: 0.5
  propagation_prob: 0.05
  n_simulations: 5
  seed_size: 5
  max_rounds: 25
  default_affinity: 0.3
  seed: 42
  celf:
    budget: 3
    candidate_pool_size: 12
    n_simulations: 2
    controlled_check: true

scaling:
  network_size_fractions: [0.25, 0.50]
  item_size_fractions: [0.25, 0.50, 1.0]
  budgets: [1, 3]
  n_simulations: 1
  candidate_pool_size: 15
  network_budget: 2
  budget_network_fraction: 0.25
  item_user_sample: 15

