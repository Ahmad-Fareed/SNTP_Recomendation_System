# Fast demonstration configuration
# Designed for quick validation (<5 min runtime)

data_dir: "Assignment"
results_dir: "results/fast_demo"

split_seed: 42
train_frac: 0.70
val_frac: 0.15

top_k: 10
relevance_threshold: 4

# Fixed, seeded sample of evaluation users for top-K ranking metrics in fast demo
ranking_sample_users: 500
ranking_sample_seed: 42

item_based_cf:
  max_neighbors: 30
  min_corated: 2

matrix_factorization:
  n_factors: 10
  lr: 0.005
  reg: 0.02
  n_epochs: 10
  seed: 42

social:
  lambda_values: [0.0, 0.3, 0.5]
  k_similar: 10
  comparison_sample: 50

diffusion:
  subgraph:
    enabled: true
    method: "ego_network"
    center_user: 0
    hops: 2
  n_simulations: 3
  seed_size: 5
  seed: 42
  max_rounds: 25
  propagation_probs: [0.01, 0.05]
  recovery_probs: [0.0, 0.2]
  base_adopt_prob: 0.5
  default_affinity: 0.3

influence:
  budgets: [1, 3, 5]
  propagation_prob: 0.05
  n_simulations: 3
  candidate_pool_size: 30
  seed: 42

group_recommendation:
  n_groups: 3
  group_size: 4
  conflicting: true
  top_n: 5
  diffusion_simulations: 3
  propagation_prob: 0.05
  base_adopt_prob: 0.5
  seed: 42

intervention:
  relevance_threshold: 0.4
  base_adopt_prob: 0.5
  propagation_prob: 0.05
  n_simulations: 3
  seed: 42

