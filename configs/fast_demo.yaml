# Fast demonstration configuration
# Designed for quick validation (<5 min runtime)

data_dir: "Assignment"
results_dir: "results/fast_demo"

split_seed: 42
train_frac: 0.70
val_frac: 0.15

top_k: 10
relevance_threshold: 4

item_based_cf:
  max_neighbors: 30
  min_corated: 2

matrix_factorization:
  n_factors: 10
  lr: 0.005
  reg: 0.02
  n_epochs: 10
  seed: 42

social:
  lambda_values: [0.0, 0.3, 0.5]
  k_similar: 10
  comparison_sample: 50

diffusion:
  n_simulations: 5
  seed_size: 5
  seed: 42
  max_rounds: 30
  propagation_probs: [0.01, 0.05]
  recovery_probs: [0.0, 0.2]
  base_adopt_prob: 0.5
  default_affinity: 0.3
